modules:
  jira:issuePanel:
    - key: complaint-triage-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: xlarge
      title: SaMD Risk Assessment
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/ui/build
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
  external:
    fetch:
      backend:
        - 'https://api.anthropic.com'
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  # dev space: Cahill Consulting Group LLC version (comment out if want to deploy to prod)
  # https://developer.atlassian.com/console/myapps/16531f54-ccb1-438d-9786-1d64b47fde39/overview
  # id: ari:cloud:ecosystem::app/16531f54-ccb1-438d-9786-1d64b47fde39
  # dev space: cullom dev version
  # https://developer.atlassian.com/console/myapps/65329069-e5d4-4822-84b3-5cd4b2c81217/overview
  id: ari:cloud:ecosystem::app/65329069-e5d4-4822-84b3-5cd4b2c81217
