modules:
  jira:issuePanel:
    - key: jira-complaint-triage-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: jira-complaint-triage
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0899ba50-2279-4d20-8bcb-8f3665886644
